name: Deploy

# Publishes the site, changelog and download links. Runs on every push to main,
# when put.gd-desktop publishes a release (repository_dispatch from its workflow),
# on a schedule as a backstop, and by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow for the screenshot pipeline tests
        run: python3 -m pip install --quiet --user --break-system-packages pillow

      - name: Install the static changelog renderer
        run: python3 -m pip install --quiet --user --break-system-packages -r tools/requirements-changelog.txt

      - name: Test the release tools
        run: python3 -m unittest discover -s tools -v

      - name: Build releases.json and the update feeds from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODENAME: ${{ vars.SITE_CODENAME_GUARD }}
        run: |
          python3 tools/releases.py --out public/_site/releases.json --feed-dir public/update/v1 --listing-out "$RUNNER_TEMP/github-releases.json"
          python3 tools/changelog.py --releases "$RUNNER_TEMP/github-releases.json"

      - name: Keep the internal design codename off the site
        # The word lives in a repository variable so it never appears in this repository.
        env:
          CODENAME: ${{ vars.SITE_CODENAME_GUARD }}
        run: |
          if [ -z "$CODENAME" ]; then echo "SITE_CODENAME_GUARD is not set; skipping"; exit 0; fi
          if grep -rIil -- "$CODENAME" public tools .github README.md; then
            echo "::error::the files above mention the internal codename"; exit 1
          fi

      - name: Render the page and check its references
        # Fills the release details into index.html, fails on any missing /_site/ file (src, href,
        # srcset and CSS url()), then stamps asset URLs with ?v=<sha>: assets are browser-cached
        # for a day, and CloudFront ignores the query string in its cache key while browsers do not.
        run: |
          python3 tools/render.py --stamp "${GITHUB_SHA::12}"
          node --check cloudfront/download-redirect.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the site
        run: |
          # Assets under /_site/ get a day of caching, the page and releases.json five minutes. All are invalidated below.
          aws s3 sync public/_site/ "s3://${{ vars.SITE_BUCKET }}/_site/" --delete --exclude releases.json \
            --cache-control "public, max-age=86400, stale-while-revalidate=604800"
          # The runner's MIME table may not know AVIF or WOFF2; set their types explicitly.
          for type in "avif image/avif" "woff2 font/woff2"; do set -- $type
            aws s3 cp public/_site/ "s3://${{ vars.SITE_BUCKET }}/_site/" --recursive --exclude "*" --include "*.$1" \
              --content-type "$2" --cache-control "public, max-age=86400, stale-while-revalidate=604800"
          done
          aws s3 cp public/_site/releases.json "s3://${{ vars.SITE_BUCKET }}/_site/releases.json" \
            --cache-control "public, max-age=300" --content-type "application/json"
          aws s3 cp public/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "public, max-age=300, stale-while-revalidate=86400" --content-type "text/html; charset=utf-8"
          # Serve the exact /changelog key through the existing site behavior. CloudFront's
          # default root object does not resolve subdirectories; no router/infra change needed.
          aws s3 cp public/changelog.html "s3://${{ vars.SITE_BUCKET }}/changelog" \
            --cache-control "public, max-age=300" --content-type "text/html; charset=utf-8"
          aws s3 cp public/robots.txt "s3://${{ vars.SITE_BUCKET }}/robots.txt" --cache-control "public, max-age=3600"
          aws s3 cp public/sitemap.xml "s3://${{ vars.SITE_BUCKET }}/sitemap.xml" --cache-control "public, max-age=3600"
          aws s3 cp public/404.html "s3://${{ vars.SITE_BUCKET }}/404.html" --cache-control "public, max-age=3600" --content-type "text/html; charset=utf-8"
          # Update feed v1 (put.gd-desktop #293) is published by the package signer to the pkg bucket,
          # after the apt and dnf repositories carry the release; /update/* routes there. The feeds
          # built above are only a contract cross-check and are not uploaded.

      - name: Point the /dl/ permalinks at the current releases
        run: python3 tools/update-kvs.py --kvs-arn "${{ vars.CLOUDFRONT_KVS_ARN }}" --releases public/_site/releases.json

      - name: Refresh the CDN
        run: |
          for id in ${{ vars.CLOUDFRONT_DISTRIBUTION_IDS }}; do
            aws cloudfront create-invalidation --distribution-id "$id" --paths "/" "/index.html" "/changelog" "/404.html" "/_site/*" "/robots.txt" "/sitemap.xml"
          done
