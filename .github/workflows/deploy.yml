name: Deploy

# Publishes the site, changelog and download links. Runs on every push to main,
# when put.gd-desktop publishes a release (repository_dispatch from its workflow),
# on a schedule as a backstop, and by hand.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The desktop repository owns and tests the installer. Deploy only reviewed
      # nightly source, also on release dispatches and the scheduled refresh.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: patrick-hudson/put.gd-desktop
          ref: nightly
          path: .installer-source
          sparse-checkout: packaging/install.sh
          sparse-checkout-cone-mode: false

      - name: Stage the desktop installer
        run: |
          # Publish only a regular file: a symlink could point at .git/config or other secrets.
          if [ ! -f .installer-source/packaging/install.sh ] || [ -L .installer-source/packaging/install.sh ]; then
            echo "::error::installer must be a regular, non-symlink file"
            exit 1
          fi
          sh -n .installer-source/packaging/install.sh
          cp --no-dereference .installer-source/packaging/install.sh public/install
          echo "INSTALLER_COMMIT=$(git -C .installer-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Pillow for the screenshot pipeline tests
        run: python3 -m pip install --quiet --user --break-system-packages pillow

      - name: Install the static changelog renderer
        run: python3 -m pip install --quiet --user --break-system-packages -r tools/requirements-changelog.txt

      - name: Test the release tools
        run: python3 -m unittest discover -s tools -v

      - name: Build releases.json and the update feeds from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODENAME: ${{ vars.SITE_CODENAME_GUARD }}
        run: |
          python3 tools/releases.py --out public/_site/releases.json --feed-dir public/update/v1 --listing-out "$RUNNER_TEMP/github-releases.json"
          python3 tools/changelog.py --releases "$RUNNER_TEMP/github-releases.json"

      - name: Keep the internal design codename off the site
        # The word lives in a repository variable so it never appears in this repository.
        env:
          CODENAME: ${{ vars.SITE_CODENAME_GUARD }}
        run: |
          if [ -z "$CODENAME" ]; then echo "SITE_CODENAME_GUARD is not set; skipping"; exit 0; fi
          if grep -rIil -- "$CODENAME" public tools .github README.md; then
            echo "::error::the files above mention the internal codename"; exit 1
          fi

      - name: Render the page and check its references
        # Fills the release details into index.html, fails on any missing /_site/ file (src, href,
        # srcset and CSS url()), then stamps asset URLs with ?v=<sha>: assets are browser-cached
        # for a day, and CloudFront ignores the query string in its cache key while browsers do not.
        run: |
          python3 tools/render.py --stamp "${GITHUB_SHA::12}"
          node --check cloudfront/download-redirect.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload changed site objects
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          python3 tools/deploy.py upload --bucket "$SITE_BUCKET" \
            --manifest "$RUNNER_TEMP/site-diff.json" --installer-commit "$INSTALLER_COMMIT"

      - name: Point the /dl/ permalinks at the current releases
        run: python3 tools/update-kvs.py --kvs-arn "${{ vars.CLOUDFRONT_KVS_ARN }}" --releases public/_site/releases.json

      - name: Refresh changed CDN paths
        # Refresh completed writes even if a later upload or KVS update failed.
        if: ${{ !cancelled() }}
        env:
          DISTRIBUTIONS: ${{ vars.CLOUDFRONT_DISTRIBUTION_IDS }}
        run: |
          if [ -f "$RUNNER_TEMP/site-diff.json" ]; then
            python3 tools/deploy.py invalidate --manifest "$RUNNER_TEMP/site-diff.json" \
              --distributions $DISTRIBUTIONS
          fi
