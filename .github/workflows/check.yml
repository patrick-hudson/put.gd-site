name: Check

# Runs the release tool tests and a dry run of the generator on pull requests, so a broken
# releases.json or update feed shows up before it reaches main (which deploys).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow for the screenshot pipeline tests
        run: python3 -m pip install --quiet --user --break-system-packages pillow

      - name: Install the static changelog renderer
        run: python3 -m pip install --quiet --user --break-system-packages -r tools/requirements-changelog.txt

      - name: Test the release tools
        run: python3 -m unittest discover -s tools -v

      - name: Generate releases.json and the update feeds from GitHub (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/releases.py --out "$RUNNER_TEMP/releases.json" --feed-dir "$RUNNER_TEMP/update/v1" --listing-out "$RUNNER_TEMP/github-releases.json"
          python3 tools/changelog.py --releases "$RUNNER_TEMP/github-releases.json"
          cat "$RUNNER_TEMP"/update/v1/*.json

      - name: Render the page and check its references
        run: |
          python3 tools/render.py --releases "$RUNNER_TEMP/releases.json"
          node --check cloudfront/download-redirect.js
