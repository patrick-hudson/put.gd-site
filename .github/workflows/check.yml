name: Check

# Runs the release tool tests, a dry run of the generator and the page build on pull requests, so a
# broken releases.json, update feed or page shows up before it reaches main (which deploys).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the release tools
        run: python3 -m unittest discover -s tools -v

      - name: Generate releases.json and the update feeds from GitHub (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/releases.py --out "$RUNNER_TEMP/releases.json" --feed-dir "$RUNNER_TEMP/update/v1"
          cat "$RUNNER_TEMP"/update/v1/*.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Type-check, test and build the page
        run: |
          npm ci
          npm test
          npm run build

      - name: Check the CloudFront function
        run: node --check cloudfront/download-redirect.js
